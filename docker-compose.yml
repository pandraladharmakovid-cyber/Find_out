services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: findout
      POSTGRES_USER: findout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findout_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - findout-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findout -d findout"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  findout-postgres-data: